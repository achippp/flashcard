<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard tiếng Hàn - Deer Education</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#14213d;--mute:#5b6783;--line:#d5dcea;--acc:#2f5bea;--acc-ink:#fff;--ok:#16825d;--bad:#c2410c;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--card:#18223a;--ink:#e8edf8;--mute:#9aa7c4;--line:#2b3a5c;--acc:#7b9bff;--acc-ink:#0f1626;--ok:#4ade9f;--bad:#fb923c}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.3rem;margin:0 0 14px}
nav{display:flex;gap:6px;margin-bottom:18px}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--mute);font-size:.9rem}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.bad{border-color:var(--bad);color:var(--bad)}
.stage{background:var(--card);border:2px solid var(--line);border-radius:18px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;cursor:pointer;width:100%;color:var(--ink)}
.stage .w{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:700;line-height:1.2;word-break:keep-all}
.stage .m{font-size:1.5rem;color:var(--acc);font-weight:600}
.stage .hint{margin-top:14px;color:var(--mute);font-size:.85rem}
.stage.known{border-color:var(--ok)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:130px;resize:vertical}
select{width:100%;padding:10px;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
li b{min-width:30%}li span{flex:1;color:var(--mute)}
li .x{border:0;background:none;color:var(--bad);padding:4px 8px}
.tick{color:var(--ok)}
.empty{padding:36px 12px;text-align:center;color:var(--mute)}
.msg{min-height:1.5em;color:var(--ok);margin-top:8px}
.deckrow{display:flex;gap:8px;align-items:stretch}
.deckrow .stage{flex:1;min-width:0;width:auto}
.arrow{flex:none;width:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:2.2rem;line-height:1;padding:0}
.arrow:active{background:var(--acc);color:var(--acc-ink)}
section[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.stage{transition:border-color .15s}}
</style>
</head>
<body>
<main>
<h1>Flashcard tiếng Hàn - Deer Education</h1>
<nav role="tablist">
  <button role="tab" data-t="study" aria-selected="true">Học</button>
  <button role="tab" data-t="add" aria-selected="false">Thêm thẻ</button>
  <button role="tab" data-t="list" aria-selected="false">Danh sách</button>
</nav>

<section id="study">
  <label for="deck" style="margin-top:0">Chọn bài học</label>
  <select id="deck"></select>
  <div class="bar">
    <span id="pos"></span>
    <span><label style="display:inline;font-weight:400;margin:0"><input type="checkbox" id="onlyNew" style="width:auto"> Chỉ thẻ chưa thuộc</label></span>
  </div>
  <div class="deckrow">
    <button class="arrow" id="prev" aria-label="Thẻ trước">&#8249;</button>
    <button class="stage" id="stage" aria-live="polite"></button>
    <button class="arrow" id="next" aria-label="Thẻ sau">&#8250;</button>
  </div>
  <div class="row"><button class="btn" id="speak">Nghe phát âm</button></div>
  <div class="row">
    <button class="btn bad" id="no">Chưa thuộc</button>
    <button class="btn ok" id="yes">Đã thuộc</button>
  </div>
  <div class="row"><button class="btn" id="shuffle">Xáo trộn thẻ</button><button class="btn" id="resetDeck">Đặt lại bài này</button><button class="btn" id="side">Đổi mặt hỏi: <span id="sideTxt">tiếng Hàn</span></button></div>
</section>

<section id="add" hidden>
  <label for="k">Từ tiếng Hàn</label>
  <input id="k" autocomplete="off">
  <label for="v">Nghĩa tiếng Việt</label>
  <input id="v" autocomplete="off">
  <div class="row"><button class="btn main" id="addOne">Thêm thẻ</button></div>
  <label for="bulk">Hoặc dán nhiều thẻ cùng lúc</label>
  <textarea id="bulk" placeholder="Mỗi dòng một thẻ, ngăn cách bằng dấu = hoặc dấu gạch ngang có khoảng trắng hoặc phím Tab&#10;물 = nước&#10;학교 - trường học&#10;친구 &#9; bạn bè"></textarea>
  <div class="row"><button class="btn main" id="addBulk">Thêm tất cả</button></div>
  <div class="msg" id="msg" role="status"></div>
</section>

<section id="list" hidden>
  <div class="bar"><span id="count"></span></div>
  <ul id="ul"></ul>
  <div class="row">
    <button class="btn" id="exp">Xuất file sao lưu</button>
    <button class="btn" id="imp">Nạp file sao lưu</button>
    <button class="btn" id="reset">Đặt lại tiến độ</button>
  </div>
  <input type="file" id="file" accept=".json" hidden>
</section>
</main>

function parse(t){return t.split(";").map(function(x){var a=x.split("=");return{k:a[0],v:a[1],ok:false}})}

function load(){try{var r=localStorage.getItem(KEY);if(r)cards=JSON.parse(r)||[];}catch(e){cards=[];}try{known=JSON.parse(localStorage.getItem(KEY+"-k"))||{};}catch(e){known={};}cur=cards;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cards));if(deck!=="mine"){cur.forEach(function(c){var n=deck+"|"+c.k;if(c.ok)known[n]=1;else delete known[n]});localStorage.setItem(KEY+"-k",JSON.stringify(known))}}catch(e){}}
var $=function(i){return document.getElementById(i)};
function pool(){var a=[];cur.forEach(function(c,i){if(!$("onlyNew").checked||!c.ok)a.push(i)});return a}
function rebuild(keep){order=pool();if(!keep)idx=0;if(idx>=order.length)idx=0;flipped=false}
function show(){
  var st=$("stage");
  if(!order.length){st.className="stage";st.innerHTML='<div class="empty">'+(cards.length?"Bạn đã thuộc hết thẻ. Bỏ chọn bộ lọc để học lại.":"Chưa có thẻ nào. Mở tab Thêm thẻ để bắt đầu.")+'</div>';$("pos").textContent="0 thẻ";return}
  var c=cur[order[idx]];
  var q=front==="k"?c.k:c.v,a=front==="k"?c.v:c.k;
  st.className="stage"+(c.ok?" known":"");
  st.innerHTML=flipped?'<div class="m"></div>':'<div class="w"></div><div class="hint">Bấm vào thẻ hoặc nhấn phím cách để lật</div>';
  (flipped?st.firstChild:st.firstChild).textContent=flipped?a:q;
  $("pos").textContent="Thẻ "+(idx+1)+" / "+order.length+(c.ok?" (đã thuộc)":"");
}
function flip(){if(order.length){flipped=!flipped;show()}}
function move(d){if(!order.length)return;idx=(idx+d+order.length)%order.length;flipped=false;show()}
function mark(v){if(!order.length)return;cur[order[idx]].ok=v;save();if($("onlyNew").checked){rebuild(true)}else{idx=(idx+1)%order.length;flipped=false}show();renderList()}
function speak(){if(!order.length||!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(cur[order[idx]].k);u.lang="ko-KR";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function renderList(){
  $("count").textContent="Thẻ của tôi: "+cards.length+" thẻ, "+cards.filter(function(c){return c.ok}).length+" đã thuộc";
  var ul=$("ul");ul.innerHTML="";
  if(!cards.length){ul.innerHTML='<li class="empty" style="display:block">Danh sách trống.</li>';return}
  cards.forEach(function(c,i){
    var li=document.createElement("li"),b=document.createElement("b"),s=document.createElement("span"),x=document.createElement("button");
    b.textContent=c.k;s.textContent=c.v+(c.ok?" ✓":"");if(c.ok)s.className="tick";
    x.className="x";x.textContent="Xóa";x.setAttribute("aria-label","Xóa thẻ "+c.k);
    x.onclick=function(){cards.splice(i,1);save();renderList();rebuild();show()};
    li.appendChild(b);li.appendChild(s);li.appendChild(x);ul.appendChild(li)});
}
function say(t){$("msg").textContent=t}
$("addOne").onclick=function(){
  var k=$("k").value.trim(),v=$("v").value.trim();
  if(!k||!v){say("Hãy nhập cả từ tiếng Hàn và nghĩa tiếng Việt.");return}
  cards.push({k:k,v:v,ok:false});save();$("k").value="";$("v").value="";$("k").focus();say("Đã thêm thẻ: "+k);renderList();rebuild(true);show()};
$("addBulk").onclick=function(){
  var n=0;$("bulk").value.split(/\r?\n/).forEach(function(l){
    var p=l.trim().split(/\t|\s+[-–|]\s+|\s*=\s*/);
    if(p.length>=2&&p[0].trim()&&p[1].trim()){cards.push({k:p[0].trim(),v:p.slice(1).join(", ").trim(),ok:false});n++}});
  if(n){save();$("bulk").value="";renderList();rebuild(true);show();say("Đã thêm "+n+" thẻ.")}else say("Không đọc được dòng nào. Mỗi dòng cần có dạng: từ Hàn = nghĩa.")};
$("exp").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,1)],{type:"application/json"}));a.download="flashcard-sao-luu.json";a.click()};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(Array.isArray(d)){d.forEach(function(c){if(c&&c.k&&c.v)cards.push({k:String(c.k),v:String(c.v),ok:!!c.ok})});save();renderList();rebuild();show()}}catch(x){alert("File không hợp lệ.")}};r.readAsText(f);e.target.value=""};
$("reset").onclick=function(){if(confirm("Đặt lại tất cả thẻ về chưa thuộc?")){cards.forEach(function(c){c.ok=false});save();renderList();rebuild();show()}};
$("shuffle").onclick=function(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=order[i];order[i]=order[j];order[j]=t}idx=0;flipped=false;show()};
$("side").onclick=function(){front=front==="k"?"v":"k";$("sideTxt").textContent=front==="k"?"tiếng Hàn":"tiếng Việt";flipped=false;show()};
$("stage").onclick=flip;$("prev").onclick=function(){move(-1)};$("next").onclick=function(){move(1)};
$("yes").onclick=function(){mark(true)};$("no").onclick=function(){mark(false)};$("speak").onclick=speak;
$("onlyNew").onchange=function(){rebuild();show()};
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
  ["study","add","list"].forEach(function(s){$(s).hidden=s!==b.dataset.t})}});
document.addEventListener("keydown",function(e){
  if(!$("study").hidden&&!/INPUT|TEXTAREA/.test(e.target.tagName)){
    if(e.key===" "){e.preventDefault();flip()}else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1)}});
load();
var sel=$("deck");
function opt(v,t){var o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o)}
opt("mine","Thẻ của tôi (tự thêm)");
Object.keys(TOPICS).forEach(function(n){opt(n,n+" ("+TOPICS[n].split(";").length+" từ)")});
sel.onchange=function(){deck=sel.value;if(deck==="mine")cur=cards;else{cur=parse(TOPICS[deck]);cur.forEach(function(c){c.ok=!!known[deck+"|"+c.k]})}rebuild();show()};
$("resetDeck").onclick=function(){if(confirm("Đặt lại bài này về chưa thuộc?")){cur.forEach(function(c){c.ok=false});save();renderList();rebuild();show()}};
rebuild();show();renderList();
})();
</script>
</body>
</html>
